<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ember - live demo</title>
<style>
  :root { color-scheme: light; }
  body { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; max-width: 56em; margin: 0 auto; padding: 1.5em 1em; color: #1c1917; }
  h1 { font-size: 1.4em; margin-bottom: 0.2em; }
  .sub { color: #57534e; font-size: 0.9em; margin-bottom: 1.2em; }
  #stats { background: #fffbeb; border: 1px solid #fde68a; padding: 0.8em; font-size: 0.85em; border-radius: 6px; }
  form { margin: 1.2em 0 0.4em; display: flex; gap: 0.5em; }
  input { flex: 1; font: inherit; padding: 0.5em; border: 1px solid #d6d3d1; border-radius: 6px; }
  button { font: inherit; padding: 0.5em 1.2em; background: #1c1917; color: #fff; border: 0; border-radius: 6px; cursor: pointer; }
  #status { color: #b45309; font-size: 0.85em; min-height: 1.4em; }
  .hit { margin: 1em 0; border: 1px solid #e7e5e4; border-radius: 6px; padding: 0.8em; }
  .hit-head { font-weight: bold; font-size: 0.85em; margin-bottom: 0.4em; }
  pre { background: #f5f5f4; padding: 0.6em; overflow-x: auto; font-size: 0.8em; border-radius: 4px; white-space: pre-wrap; word-break: break-word; }
  a { color: #1d4ed8; font-size: 0.8em; }
  footer { margin-top: 2em; color: #78716c; font-size: 0.8em; }
</style>
</head>
<body>
<h1>Ember - live demo</h1>
<div class="sub">Persistent, queryable memory for coding agents. This page runs Ember's real search engine in your browser.</div>
<div id="stats">loading ...</div>
<form id="form"><input id="q" placeholder="ask about the ember codebase - e.g. how are corrupt index files handled" autofocus><button type="submit">search</button></form>
<div id="status"></div>
<div id="results"></div>
<footer>
  Offline lexical retrieval (deterministic, no data leaves your browser).
  <a href="https://github.com/dp177/ember">github.com/dp177/ember</a> - built for the Alan AI OpenFire hackathon.
</footer>
<script type="module" src="./demo-web/main.js"></script>
</body>
</html>
